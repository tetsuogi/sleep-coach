   毎朝「昨夜は何時に寝たか」を記録し、7日中5日目標を守れた週の翌週は目標を15分前に進める（v4 から継続）。
   夜に意志で勝つ仕組み（クイズ・誓い・置き場の申告など）は v3.5 まで。旧版は git のタグ v3.5 に残してある。

var GAS_URL = "https://script.google.com/macros/s/AKfycbyW2pnI_itkHuSoLAeEQRvv9paG72sHy7mFsuRTdITLgj805TdFKqqO0TnJB5gZVFuq/exec";

// 朝の記録の選択肢。late は目標からの遅れ（分）。0 だけが達成

// エビデンスのランクと重み（ポイント = 手間 × 重み）

};

  { id: "todo", group: "ルーティーン", label: "明日やることを書き出す", deadline: null, evidence: "C", effort: 1,

  { id: "stretch", group: "ルーティーン", label: "軽いストレッチ", deadline: null, evidence: "C", effort: 1,

    why: "1日の区切り。毎晩同じ順番の行動が、眠りの合図になっていく" },
  { id: "meditation", group: "ルーティーン", label: "瞑想する（5分以上）", deadline: null, evidence: "B", effort: 2,
    why: "睡眠の質が改善したというメタ分析がある（比べる相手によって結果は変わる）" },
  { id: "phone", group: "寝室", label: "スマホを寝室の外に置く", deadline: 0, evidence: "B", effort: 3,
    why: "ベッドでの画面使用は、1時間ごとに不眠リスクが上がる（大規模調査）" },
  { id: "tablet", group: "寝室", label: "タブレットを寝室の外に置く", deadline: 0, evidence: "B", effort: 2,
    why: "スマホだけ遠ざけても、別の画面が役割を引き継ぐ" },
  { id: "temp", group: "寝室", label: "寝室の温度を整える（エアコン・寝具）", deadline: null, evidence: "B", effort: 1,
    why: "暑すぎ・寒すぎは深い睡眠を減らす" },
  { id: "ventilate", group: "寝室", label: "寝室を換気する", deadline: null, evidence: "C", effort: 1,
    why: "換気の少ない寝室では深い睡眠が短かった（小規模な実地研究）" },
  { id: "dark", group: "寝室", label: "寝室を真っ暗にする（豆電球を消す）", deadline: null, evidence: "C", effort: 1,
    why: "睡眠中の光が、眠っている間の体の休まり方に影響したという実験がある" }
];
var ITEM_GROUPS = ["日中〜夕方", "夜の流れ", "ルーティーン", "寝室"];

// エアコン（ダイキン）の設定。推奨温度は機種・断熱・寝具で変わるので、自分の設定を季節ごとに登録する。
// mode: "temp"（温度設定）/ "ai"（AI自動。基準から0.5℃刻みで上下）
// timer: "none" / "on" / "off"、timerHours は0.5時間刻み
var AIRCON_DEFAULT = {
  season: (function() { var m = new Date().getMonth() + 1; return m >= 5 && m <= 10 ? "summer" : "winter"; })(),
  summer: { mode: "ai", temp: 26, aiOffset: 0, timer: "none", timerHours: 2 },
  winter: { mode: "ai", temp: 20, aiOffset: 0, timer: "none", timerHours: 6 }
};
var AIRCON_RANGE = {
  temp: [16, 32],
  aiOffset: [-3, 3],
  timerHours: [0.5, 12]
};

var STORAGE_KEY = "sleep-coach-v4";   // v3.5 までの "sleep-coach-data" とは混ぜない
var QUEUE_KEY = "sleep-coach-queue";

/* ============================================================
   ユーティリティ
   ============================================================ */
// デバッグフック: ?h=7&m=30 で時刻を偽装（本番動作には無影響）
var DEBUG = (function() {
  var out = {};
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.has("h")) out.hour = parseInt(p.get("h"), 10);
    if (p.has("m")) out.min = parseInt(p.get("m"), 10);
  } catch (err) {}
  return out;
})();

// 「その日」の境界。0:00ではなく朝4:00で日付を切り替え、0:00〜3:59は前日の夜の続きとして扱う
var DAY_ROLLOVER_HOUR = 4;

// 論理上の「今日」を表すDate。DEBUG.hour が指定されていればその時刻として扱う
function logicalDate() {
  var d = new Date();
  if (typeof DEBUG.hour === "number" && !isNaN(DEBUG.hour)) d.setHours(DEBUG.hour);
  if (typeof DEBUG.min === "number" && !isNaN(DEBUG.min)) d.setMinutes(DEBUG.min);
  if (d.getHours() < DAY_ROLLOVER_HOUR) d.setDate(d.getDate() - 1);
  return d;
}

function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function getToday() {
  return fmtDate(logicalDate());
}

// 日付キーに n 日足す（正午で計算してタイムゾーンのずれを避ける）
function addDays(key, n) {
  var d = new Date(key + "T12:00:00");
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}

// その日が属する週（日曜始まり）の日曜を "yyyy-MM-dd" で返す
function weekKeyOf(key) {
  var d = new Date(key + "T12:00:00");
  return addDays(key, -d.getDay());
}

function getDayOfWeek(key) {
  return ["日", "月", "火", "水", "木", "金", "土"][new Date(key + "T12:00:00").getDay()];
}

// 0時からの分（マイナス可）を "23:45" の形に（-15 → 23:45、-75 → 22:45）
function fmtClock(mins) {
  var m = ((mins % 1440) + 1440) % 1440;
  return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
}

// 分数を「5時間45分」の形に
function fmtDuration(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  return h + "時間" + (m ? m + "分" : "");
}

// 0.5刻みに丸めて範囲内に収める
function clampHalf(v, range) {
  return Math.min(range[1], Math.max(range[0], Math.round(v * 2) / 2));
}

// AIの補正値を「+0.5」「−1.0」「±0.0」の形に
function fmtSigned(n) {
  return (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(1);
}

// 「冬・AI自動 +0.5℃・オンタイマー 5.5時間」のような要約
function airconSummary(ac) {
  var s = ac[ac.season];
  var summer = ac.season === "summer";
  var parts = [summer ? "夏" : "冬"];
  parts.push(s.mode === "ai" ? "AI自動 " + fmtSigned(s.aiOffset) + "℃" : (summer ? "冷房 " : "暖房 ") + s.temp.toFixed(1) + "℃");
  if (s.timer !== "none") parts.push((s.timer === "on" ? "オンタイマー " : "オフタイマー ") + s.timerHours + "時間");
  return parts.join("・");
}

function assign() {
  var result = {};
  for (var i = 0; i < arguments.length; i++) {
    var obj = arguments[i];
    if (obj) for (var k in obj) { if (obj.hasOwnProperty(k)) result[k] = obj[k]; }
  }
  return result;
}

/* ============================================================
   ポイント
   ============================================================ */
// djb2 ＋乗算ハッシュ（v3.5 から復活）。日替わりボーナスの選択に使う
function hashStr(str) {
  var h = 5381;
  for (var i = 0; i < str.length; i++) { h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; }
  return (Math.imul(h, 2654435761) >>> 0) >>> 8;
}

function itemPoints(item) { return item.effort * EVIDENCE[item.evidence].weight; }

// その夜のボーナス項目（柱の Mac は対象外）。日付で決まるので、夜と翌朝で変わらない
function bonusItemId(key) {
  var pool = ITEMS.filter(function(it) { return !it.pillar; });
  return pool[hashStr(key + "-bonus") % pool.length].id;
}

// 朝の記録（消灯時刻）が済んでいるか。v5 では夜のチェックだけ付いた夜（late なし）があるので、
// 「nights[key] がある＝記録済み」とは扱えない
function isRecorded(night) { return !!(night && night.late !== undefined); }

// その夜の点数。checks は { itemId: true }、late は朝の記録（未記録なら undefined）
function nightPoints(night, key) {
  if (!night) return 0;
  var checks = night.checks || {}, bonus = bonusItemId(key), sum = 0;
  ITEMS.forEach(function(it) {
    if (checks[it.id]) sum += itemPoints(it) * (it.id === bonus ? 2 : 1);
  });
  if (night.late === 0) sum += LIGHTS_OUT_POINTS;
  return sum;
}

// クリア = 柱2本（消灯の目標・Mac）＋目標点以上
function nightCleared(night, key) {
  return !!(night && night.late === 0 && night.checks && night.checks.mac && nightPoints(night, key) >= TARGET_POINTS);
}

function totalPoints(data) {
  var sum = 0;
  for (var k in data.nights) { if (data.nights.hasOwnProperty(k)) sum += nightPoints(data.nights[k], k); }
  return sum;
}

/* ============================================================
   目標と週の判定
   ============================================================ */
// その日の夜に有効だった目標。目標の変更は週の頭（日曜）から有効になる
function targetFor(data, key) {
  var w = weekKeyOf(key);
  var t = data.targets[0].target;
  for (var i = 0; i < data.targets.length; i++) {
    if (data.targets[i].fromWeek <= w) t = data.targets[i].target;
  }
  return t;
}

function wonCount(data, weekKey) {
  var won = 0;
  for (var i = 0; i < 7; i++) {
    var n = data.nights[addDays(weekKey, i)];
    if (n && n.late === 0) won++;
  }
  return won;
}

// まだ判定していない、終わった週を順に判定する（何週間も開かなかった場合もまとめて処理）。
// 使い始めた週は日数が足りないので、judgedWeek の初期値にして判定対象から外している
function judgeWeeks(data) {
  var today = getToday();
  var thisWeek = weekKeyOf(today);
  var out = data, events = [];
  var w = addDays(out.judgedWeek, 7);
  while (w < thisWeek) {
    // 土曜の夜は日曜の朝に記録される。記録が済むか、月曜になるまでは判定を待つ
    if (!isRecorded(out.nights[addDays(w, 6)]) && today < addDays(w, 8)) break;
    var cur = targetFor(out, w);
    var patch = { judgedWeek: w };
    if (wonCount(out, w) >= NEED_PER_WEEK && cur > FINAL_TARGET) {
      var next = Math.max(FINAL_TARGET, cur - STEP);
      patch.targets = out.targets.concat([{ fromWeek: addDays(w, 7), target: next }]);
      // お知らせが残っていれば、前進前の時刻はそのまま引き継ぐ
      patch.stepNotice = { from: out.stepNotice ? out.stepNotice.from : cur, to: next };
      events.push(["targetChange", fmtClock(cur) + "→" + fmtClock(next)]);
    }
    out = assign({}, out, patch);
    w = addDays(w, 7);
  }
  return { data: out, events: events };
}

function initialData() {
  var today = getToday();
  var week = weekKeyOf(today);
  return {
    targets: [{ fromWeek: week, target: START_TARGET }],
    startDate: today,
    startWeek: week,
    judgedWeek: week,
    stepNotice: null,
    nights: {}
  };
}

/* ============================================================
   GAS連携（イベント送信 + オフラインキュー）
   ============================================================ */
function loadQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch (err) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (err) {}
}

function postEvent(payload) {
  // fetch を試み、失敗したらキューに積む
  return fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function() { return true; }).catch(function() { return false; });
}

// date を省略すると今日。朝の記録は「昨夜の日付」で送る
function sendEvent(event, detail, date) {
  if (!GAS_URL) return; // 未設定ならローカルのみ
  var payload = {
    token: GAS_TOKEN,
    date: date || getToday(),
    event: event,
    time: new Date().toISOString(),
    detail: detail || ""
  };
  postEvent(payload).then(function(ok) {
    if (!ok) {
      var q = loadQueue();
      q.push(payload);
      saveQueue(q);
    }
  });
}

function flushQueue() {
  if (!GAS_URL) return;
  var q = loadQueue();
  if (!q.length) return;
  saveQueue([]); // 楽観的にクリア。失敗分は再度積まれる
  q.forEach(function(payload) {
    postEvent(payload).then(function(ok) {
      if (!ok) { var cur = loadQueue(); cur.push(payload); saveQueue(cur); }
    });
  });
}

  itemCheckOn: { backgroundColor: "#22c55e", border: "2px solid #22c55e" },

  itemPoints: { fontSize: 14, fontWeight: 700, color: "#888", flexShrink: 0, fontVariantNumeric: "tabular-nums" },
  itemPointsBonus: { color: "#f59e0b" },
  pillarBadge: { fontSize: 11, fontWeight: 800, color: "#000", backgroundColor: "#f59e0b", borderRadius: 4, padding: "1px 5px", marginLeft: 6 },
  itemBottom: { display: "flex", gap: 8, marginTop: 4, paddingLeft: 32, fontSize: 12, color: "#666", lineHeight: 1.5 },

  stickyTop: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 },

  // 未完了 / 完了のタブ

  tabOn: { backgroundColor: "#262626", color: "#f5f5f5", border: "1px solid #555" },

  // エアコンの設定

  stepper: { display: "flex", alignItems: "center", gap: 10 },

  // 今夜のボーナス

  bonusTitle: { fontSize: 12, color: "#f59e0b", fontWeight: 800, letterSpacing: "0.1em", marginBottom: 6 },

  bonusBadge: { fontSize: 11, fontWeight: 800, color: "#000", backgroundColor: "#f59e0b", borderRadius: 4, padding: "1px 6px", marginLeft: 6 },
  // タップ直後に浮かぶ表示
  toast: { position: "fixed", left: "50%", bottom: 28, zIndex: 20, padding: "12px 20px", borderRadius: 999, backgroundColor: "#22c55e", color: "#00140a", fontSize: 17, fontWeight: 800, whiteSpace: "nowrap", boxShadow: "0 6px 24px rgba(0,0,0,0.5)", animation: "toastUp 1.6s ease-out forwards", pointerEvents: "none" },

};

/* ============================================================
   メインコンポーネント
   ============================================================ */
function SleepCoach() {
  var dataState = useState(null);
  var data = dataState[0], setData = dataState[1];

  var acEditState = useState(false); // エアコンの設定を編集中か
  var acEdit = acEditState[0], setAcEdit = acEditState[1];

  var tabState = useState("todo");   // チェックリストのタブ: "todo"（未完了）/ "done"（完了）
  var tab = tabState[0], setTab = tabState[1];

  // タップ直後に浮かぶ表示。n は毎回変えて、同じ文言でもアニメーションをやり直させる
  var toastState = useState(null);   // { text, kind: "plus" | "minus" | "goal", n }
  var toast = toastState[0], setToast = toastState[1];

  function save(d) {
    setData(d);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (err) {}
  }

  function sendTargetEvents(events) {
    events.forEach(function(ev) { sendEvent(ev[0], ev[1]); });
  }

  useEffect(function() {
    var loaded = null;
    try { loaded = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (err) {}
    flushQueue(); // 溜まった未送信イベントを再送
    var r = judgeWeeks(loaded || initialData());
    save(r.data);
    sendTargetEvents(r.events);
  }, []);

  if (!data) {
    return e("div", { style: S.container }, e("div", { style: S.loadingText }, "読み込み中..."));
  }

  var today = getToday();
  var lastNight = addDays(today, -1);
  var lastNightTarget = targetFor(data, lastNight);
  var target = targetFor(data, today);
  var thisWeek = weekKeyOf(today);

  // 朝の記録。夜に付けたチェックは消さずに消灯時刻をマージする。
  // 保存したらすぐ週の判定もやり直す（日曜の朝に土曜の夜を記録した時点で前進が決まる）
  function handleRecord(late) {
    var nights = assign({}, data.nights);
    nights[lastNight] = assign({}, data.nights[lastNight], { target: lastNightTarget, late: late });
    var r = judgeWeeks(assign({}, data, { nights: nights }));
    save(r.data);
    var pts = nightPoints(nights[lastNight], lastNight);
    var cleared = nightCleared(nights[lastNight], lastNight);
    sendEvent("sleep", "目標" + fmtClock(lastNightTarget) + " / " + lateLabel(lastNightTarget, late) +
      " / " + pts + "pt / " + (cleared ? "クリア" : "未クリア"), lastNight);
    sendTargetEvents(r.events);
  }

  // チェックの付け外し。target / late など既存の値は保持する
  function toggleCheck(key, id) {
    var night = data.nights[key] || {};
    var checks = assign({}, night.checks);
    if (checks[id]) delete checks[id]; else checks[id] = true;
    var nights = assign({}, data.nights);
    nights[key] = assign({}, night, { checks: checks });
    save(assign({}, data, { nights: nights }));
    return { before: nightPoints(night, key), after: nightPoints(nights[key], key), on: !!checks[id] };
  }

  // 今夜のチェック。付け外しのたびに、点数の増減を画面下に浮かべる
  function toggleTonight(id) {
    var r = toggleCheck(today, id);
    var diff = r.after - r.before;
    var reachedGoal = r.before < TARGET_POINTS && r.after >= TARGET_POINTS;
    var text = reachedGoal
      ? "🎉 目標点に到達！ 今夜 " + r.after + "pt"
      : (diff > 0 ? "+" : "−") + Math.abs(diff) + "pt　今夜 " + r.after + " / " + TARGET_POINTS;
    setToast({ text: text, kind: reachedGoal ? "goal" : (r.on ? "plus" : "minus"), n: (toast ? toast.n : 0) + 1 });
  }

  function lateLabel(t, late) {
    if (late === 0) return fmtClock(t) + "までに（達成）";
    if (late === 99) return fmtClock(t + 60) + "より後";
    return "〜" + fmtClock(t + late);
  }

  var lastNightData = data.nights[lastNight];
  var lastChecks = (lastNightData && lastNightData.checks) || {};

  // --- 朝の記録（昨夜をまだ記録していないときだけ）: 昨夜のチェックを付け足してから、消灯時刻で確定 ---
  var recordCard = isRecorded(lastNightData) ? null : e("div", { style: S.card },
    e("div", { style: S.cardLabel }, "昨夜の仕上げ"),
    e("div", { style: assign({}, S.question, { fontSize: 15 }) }, "やったことを付け足す"),
    e("div", { style: S.chipRow },
      ITEMS.map(function(it) {
        return e("button", {
          key: it.id,
          style: assign({}, S.chip, lastChecks[it.id] ? S.chipOn : {}),
          onClick: function() { toggleCheck(lastNight, it.id); }
        }, (lastChecks[it.id] ? "✓ " : "") + it.label);
      })
    ),
    e("div", { style: S.question }, "昨夜は何時に寝た？"),
    LATE_OPTIONS.map(function(late) {
      return e("button", {
        key: late,
        style: assign({}, S.choiceBtn, late === 0 ? S.choiceBtnWon : {}),
        onClick: function() { handleRecord(late); }
      }, lateLabel(lastNightTarget, late));
    })
  );

  // --- 昨夜の結果（朝の記録が済んだ日は一日中表示） ---
  var resultCard = null;
  if (isRecorded(lastNightData)) {
    var lastPts = nightPoints(lastNightData, lastNight);
    var resultText;
    if (nightCleared(lastNightData, lastNight)) {
      resultText = "昨夜 " + lastPts + "pt — クリア！";
    } else {
      var missing = [];
      if (lastNightData.late !== 0) missing.push("消灯の目標");
      if (!lastChecks.mac) missing.push("Macの作業");
      resultText = missing.length
        ? "昨夜 " + lastPts + "pt — 柱（" + missing.join("・") + "）が欠けてクリアならず"
        : "昨夜 " + lastPts + "pt — あと" + (TARGET_POINTS - lastPts) + "ptでクリア";
    }
    resultCard = e("div", { style: S.card },
      e("div", { style: S.cardLabel }, "昨夜の結果"),
      e("div", { style: S.resultText }, resultText)
    );
  }

  // --- 目標が前に進んだお知らせ（「変更した」を押すまで表示） ---
  var notice = data.stepNotice;
  var noticeCard = notice ? e("div", { style: assign({}, S.card, S.noticeCard) },
    e("div", { style: assign({}, S.cardLabel, { color: "#f59e0b" }) }, "目標が前に進みました"),
    e("div", { style: S.noticeText },
      "消灯の目標が " + fmtClock(notice.from) + " → " + fmtClock(notice.to) + " になりました。",
      e("br"),
      "ルーティーンの開始は " + fmtClock(notice.to - ROUTINE_LEAD) + "。iPhone のショートカットの時刻を変えてください。"),
    e("button", { style: S.noticeBtn, onClick: function() { save(assign({}, data, { stepNotice: null })); } }, "ショートカットを変更した")
  ) : null;

  // --- 今夜 ---
  var tonightChecks = (data.nights[today] && data.nights[today].checks) || {};
  var tonightPts = nightPoints(data.nights[today], today);
  var bonusId = bonusItemId(today);
  var bonusItem = ITEMS.filter(function(it) { return it.id === bonusId; })[0];
  var tonightCard = e("div", { style: S.card },
    e("div", { style: S.cardLabel }, "今夜"),
    e("div", { style: S.clockRow },
      e("div", { style: S.clockBlock },
        e("div", { style: S.clockLabel }, "ルーティーン開始"),
        e("div", { style: S.clockMid }, fmtClock(target - ROUTINE_LEAD))
      ),
      e("div", { style: S.clockBlock },
        e("div", { style: S.clockLabel }, "消灯の目標"),
        e("div", { style: S.clockBig }, fmtClock(target))
      )
    ),
    e("div", { style: assign({}, S.sleepNote, { marginBottom: 0 }) }, fmtClock(WAKE_TIME) + " 起床なら、睡眠は " + fmtDuration(WAKE_TIME - target))
  );

  // --- 画面上部に固定する今夜のゲージ ---
  var stickyBar = e("div", { style: S.stickyBar },
    e("div", { style: S.stickyTop },
      e("div", { style: assign({}, S.stickyPts, tonightPts >= TARGET_POINTS ? { color: "#f59e0b" } : {}) },
        "今夜 " + tonightPts + " / " + TARGET_POINTS + "pt"),
      e("div", { style: S.stickyPillar }, "柱：Mac " + (tonightChecks.mac ? "✓" : "未") + " ／ 消灯は翌朝")
    ),
    e("div", { style: assign({}, S.barOuter, { marginBottom: 0 }) },
      e("div", { style: assign({}, S.barInner, { width: Math.min(100, tonightPts / TARGET_POINTS * 100) + "%", transition: "width 0.4s ease" }) })
    )
  );

  // --- 今夜のボーナス（目立たせる） ---
  var bonusDone = !!tonightChecks[bonusItem.id];
  var bonusCard = e("div", { style: assign({}, S.bonusCard, bonusDone ? { animation: "none", opacity: 0.75 } : {}) },
    e("div", { style: S.bonusTitle }, "★ 今夜のボーナス ★"),
    e("div", { style: S.bonusName }, bonusItem.label),
    e("div", { style: S.bonusPts }, bonusDone
      ? "✓ 獲得済み（+" + itemPoints(bonusItem) * 2 + "pt）"
      : "ポイント2倍：+" + itemPoints(bonusItem) + " → +" + itemPoints(bonusItem) * 2 + "pt")
  );

  // --- エアコンの設定（季節ごと。数値は − / ＋ で0.5刻み） ---
  var aircon = data.aircon || AIRCON_DEFAULT;
  var acSeason = aircon[aircon.season];

  function saveAircon(ac) { save(assign({}, data, { aircon: ac })); }
  function updateSeason(patch) {
    var ac = assign({}, aircon);
    ac[aircon.season] = assign({}, acSeason, patch);
    saveAircon(ac);
  }

  function segment(options, value, onPick) {
    return e("div", { style: S.tabRow }, options.map(function(o) {
      return e("button", { key: o[0], style: assign({}, S.tab, value === o[0] ? S.tabOn : {}), onClick: function() { onPick(o[0]); } }, o[1]);
    }));
  }
  function stepper(text, field, range) {
    return e("div", { style: S.stepper },
      e("button", { style: S.stepBtn, onClick: function() { var p = {}; p[field] = clampHalf(acSeason[field] - 0.5, range); updateSeason(p); } }, "−"),
      e("div", { style: S.stepValue }, text),
      e("button", { style: S.stepBtn, onClick: function() { var p = {}; p[field] = clampHalf(acSeason[field] + 0.5, range); updateSeason(p); } }, "＋")
    );
  }

  // オンタイマーのとき：起床30分前に動かすには、消灯の目標時刻に何時間でセットすればいいか
  var onTimerHint = null;
  if (acSeason.timer === "on") {
    var onAt = WAKE_TIME - 30;
    var hours = Math.round(((onAt - target + 1440) % 1440) / 30) / 2;
    onTimerHint = "起床30分前（" + fmtClock(onAt) + "）に動かすなら、消灯の目標 " + fmtClock(target) + " にセットして約" + hours + "時間";
  }

  var airconCard = e("div", { style: S.card },
    e("div", { style: S.cardLabel }, "エアコンの設定"),
    e("div", { style: S.acSummary }, airconSummary(aircon)),
    onTimerHint ? e("div", { style: S.acHint }, onTimerHint) : null,
    e("button", { style: S.linkBtn, onClick: function() { setAcEdit(!acEdit); } }, acEdit ? "閉じる" : "設定を変える"),
    acEdit ? e("div", null,
      e("div", { style: S.formLabel }, "今の季節（季節ごとに設定を保存）"),
      segment([["summer", "夏"], ["winter", "冬"]], aircon.season, function(v) { saveAircon(assign({}, aircon, { season: v })); }),
      e("div", { style: S.formLabel }, "運転"),
      segment([["temp", "温度設定"], ["ai", "AI自動"]], acSeason.mode, function(v) { updateSeason({ mode: v }); }),
      acSeason.mode === "temp"
        ? e("div", null, e("div", { style: S.formLabel }, "設定温度"), stepper(acSeason.temp.toFixed(1) + "℃", "temp", AIRCON_RANGE.temp))
        : e("div", null, e("div", { style: S.formLabel }, "AIの基準から"), stepper(fmtSigned(acSeason.aiOffset) + "℃", "aiOffset", AIRCON_RANGE.aiOffset)),
      e("div", { style: S.formLabel }, "タイマー"),
      segment([["none", "なし"], ["on", "オン"], ["off", "オフ"]], acSeason.timer, function(v) { updateSeason({ timer: v }); }),
      acSeason.timer !== "none"
        ? e("div", null, e("div", { style: S.formLabel }, "時間"), stepper(acSeason.timerHours + "時間", "timerHours", AIRCON_RANGE.timerHours))
        : null
    ) : null
  );

  // --- チェックリスト（未完了 / 完了のタブ。未完了タブではボーナス項目を先頭に出す） ---
  function itemRow(it) {
    var on = !!tonightChecks[it.id];
    var isBonus = it.id === bonusItem.id;
    var pts = itemPoints(it) * (isBonus ? 2 : 1);
    var ev = EVIDENCE[it.evidence];
    return e("button", {
      key: it.id,
      style: assign({}, S.itemRow, isBonus && !on ? S.bonusRow : {}),
      onClick: function() { toggleTonight(it.id); }
    },
      e("div", { style: S.itemTop },
        e("div", { style: assign({}, S.itemCheck, on ? assign({}, S.itemCheckOn, { animation: "checkPop 0.3s ease-out" }) : {}) }, on ? "✓" : ""),
        e("div", { style: S.itemLabel },
          it.label,
          it.deadline !== null ? e("span", { style: S.itemDeadline }, "〜" + fmtClock(target + it.deadline)) : null,
          it.pillar ? e("span", { style: S.pillarBadge }, "柱") : null,
          isBonus ? e("span", { style: S.bonusBadge }, "★ボーナス") : null
        ),
        e("div", { style: assign({}, S.itemPoints, isBonus ? S.itemPointsBonus : {}) }, "+" + pts + (isBonus ? " ×2" : ""))
      ),
      e("div", { style: S.itemBottom },
        e("span", { style: assign({}, S.evidenceBadge, { color: ev.color, borderColor: ev.color }) }, ev.label),
        e("span", null, it.why)
      ),
      // 寝室の温度の項目には、自分で登録したエアコンの設定を出す
      it.id === "temp" ? e("div", { style: assign({}, S.itemBottom, { color: "#f59e0b" }) }, "設定：" + airconSummary(aircon)) : null
    );
  }

  var doneCount = ITEMS.filter(function(it) { return tonightChecks[it.id]; }).length;
  var tabItems = ITEMS.filter(function(it) { return tab === "done" ? tonightChecks[it.id] : !tonightChecks[it.id]; });
  var listBody;
  if (!tabItems.length) {
    listBody = e("div", { style: S.emptyText }, tab === "done"
      ? "まだ完了した項目はありません。"
      : "全部完了！ 今夜できることはやり切りました。");
  } else {
    var bonusFirst = tab === "todo" && !tonightChecks[bonusItem.id]
      ? e("div", { key: "bonus" }, e("div", { style: assign({}, S.groupLabel, { color: "#f59e0b" }) }, "★ 今夜のボーナス"), itemRow(bonusItem))
      : null;
    listBody = [bonusFirst].concat(ITEM_GROUPS.map(function(group) {
      var rows = tabItems.filter(function(it) {
        return it.group === group && !(bonusFirst && it.id === bonusItem.id);
      });
      if (!rows.length) return null;
      return e("div", { key: group },
        e("div", { style: S.groupLabel }, group),
        rows.map(itemRow)
      );
    }));
  }

  var checklistCard = e("div", { style: S.card },
    e("div", { style: S.cardLabel }, "今夜のチェックリスト"),
    e("div", { style: S.tabRow },
      e("button", { style: assign({}, S.tab, tab === "todo" ? S.tabOn : {}), onClick: function() { setTab("todo"); } },
        "未完了 " + (ITEMS.length - doneCount)),
      e("button", { style: assign({}, S.tab, tab === "done" ? S.tabOn : {}), onClick: function() { setTab("done"); } },
        "完了 " + doneCount)
    ),
    listBody
  );

  var toastEl = toast ? e("div", {
    key: "toast-" + toast.n,
    style: assign({}, S.toast, toast.kind === "minus" ? S.toastMinus : {}, toast.kind === "goal" ? S.toastGoal : {})
  }, toast.text) : null;

  // --- 今週 ---
  var won = wonCount(data, thisWeek);
  var weekDots = [];
  var weekPts = 0;
  for (var i = 0; i < 7; i++) {
    var key = addDays(thisWeek, i);
    var n = data.nights[key];
    var bg, label;
    if (n && n.late === 0) { bg = "#22c55e"; label = "✓"; }
    else if (isRecorded(n)) { bg = n.late <= 30 ? "#f59e0b" : "#ef4444"; label = "✗"; }
    else if (key < data.startDate) { bg = "transparent"; label = ""; }  // 使い始める前の夜（記録の対象外）
    else if (key < lastNight) { bg = "#333"; label = "−"; } // 記録しなかった夜
    else { bg = "transparent"; label = ""; }                // 記録待ちの昨夜と、まだ来ていない夜
    var dotBorder = bg === "transparent" && key >= data.startDate ? { border: "1px solid #2a2a2a" } : {};
    var dayPts = nightPoints(n, key);
    weekPts += dayPts;
    weekDots.push(e("div", { key: key, style: S.weekDay },
      e("div", { style: S.weekDayLabel }, getDayOfWeek(key)),
      e("div", { style: assign({}, S.weekDot, { backgroundColor: bg }, dotBorder) }, label),
      // その夜の点数。クリアした夜は金色
      e("div", { style: assign({}, S.weekPoints, nightCleared(n, key) ? { color: "#f59e0b", fontWeight: 700 } : {}) }, dayPts ? dayPts : "")
    ));
  }

  var total = totalPoints(data);
  var level = Math.floor(total / LEVEL_STEP) + 1;
  var toNext = level * LEVEL_STEP - total;

  var nextTarget = Math.max(FINAL_TARGET, target - STEP);
  var weekText;
  if (target <= FINAL_TARGET) {
    weekText = "最終目標の " + fmtClock(FINAL_TARGET) + " に到達。この時刻を続ける。";
  } else if (thisWeek === data.startWeek) {
    weekText = "使い始めの週なので判定はなし。来週から、7日中" + NEED_PER_WEEK + "日で15分前へ進みます。";
  } else if (won >= NEED_PER_WEEK) {
    weekText = "今週は達成（" + won + "/7）。来週は " + fmtClock(nextTarget) + " に進みます。";
  } else {
    weekText = "達成 " + won + "/7。あと" + (NEED_PER_WEEK - won) + "日で、来週は " + fmtClock(nextTarget) + " に。";
  }

  var weekCard = e("div", { style: S.card },
    e("div", { style: S.cardLabel }, "今週"),
    e("div", { style: S.weekRow }, weekDots),
    e("div", { style: S.weekText }, weekText),
    e("div", { style: assign({}, S.weekText, { marginTop: 8, color: "#999" }) },
      "今週 " + weekPts + "pt ／ 累計 " + total + "pt ・ Lv." + level + "（あと" + toNext + "ptで Lv." + (level + 1) + "）")
  );

  // --- ランクの説明 ---
  var legend = e("div", { style: S.legend },
    "ポイント = 手間（小1・中2・大3）× ランクの重み",
    ["A", "B", "C", "P"].map(function(k) {
      var ev = EVIDENCE[k];
      return e("div", { key: k }, ev.label + "（×" + ev.weight + "）：" + ev.desc);
    }),
    "クリア = 目標 " + TARGET_POINTS + "pt 以上 ＋ 柱2本（消灯の目標・Macの作業）"
  );

  return e("div", { style: S.container }, stickyBar, recordCard, resultCard, noticeCard, tonightCard, bonusCard, checklistCard, airconCard, weekCard, legend, toastEl);
}

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(SleepCoach));
  </script>
</body>
</html>
