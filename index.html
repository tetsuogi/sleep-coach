function getHour() {
  if (typeof DEBUG.hour === "number" && !isNaN(DEBUG.hour)) return DEBUG.hour;
  return new Date().getHours();

  if (typeof DEBUG.day === "number" && !isNaN(DEBUG.day)) return DEBUG.day;

function getToday() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function getDayOfWeek(dateStr) {
  var days = ["日", "月", "火", "水", "木", "金", "土"];
  return days[new Date(dateStr).getDay()];
}

// 金(5)・土(6)・日(0) はフリー選択可能な日

  var d = getDayNum();
  return d === 5 || d === 6 || d === 0;

function hashStr(str) {
  var h = 5381;
  for (var i = 0; i < str.length; i++) {
    h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  }
  return h;
}

function assign() {
  var result = {};
  for (var i = 0; i < arguments.length; i++) {
    var obj = arguments[i];
    if (obj) for (var k in obj) { if (obj.hasOwnProperty(k)) result[k] = obj[k]; }
  }
  return result;
}

function shuffleFacts(today) {
  return FACTS.slice().sort(function(a, b) {
    var ha = hashStr(today + "-" + FACTS.indexOf(a)) % 9973;
    var hb = hashStr(today + "-" + FACTS.indexOf(b)) % 9973;
    return ha - hb;
  }).slice(0, 4);
}

// クイズ選択肢を日替わりでシャッフル
function shuffleChoices(choices, today, salt) {
  return choices.slice().sort(function(a, b) {
    var ha = hashStr(today + salt + a) % 9973;
    var hb = hashStr(today + salt + b) % 9973;
    return ha - hb;
  });
}

function todayRecord(data) {

/* ============================================================
   GAS連携（イベント送信 + オフラインキュー）
   ============================================================ */
function loadQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch (err) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (err) {}
}

function postEvent(payload) {
  // fetch を試み、失敗したらキューに積む
  return fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function() { return true; }).catch(function() { return false; });
}

function sendEvent(event, detail) {
  if (!GAS_URL) return; // 未設定ならローカルのみ
  var payload = {
    token: GAS_TOKEN,
    date: getToday(),
    event: event,
    time: new Date().toISOString(),
    detail: detail || ""
  };
  postEvent(payload).then(function(ok) {
    if (!ok) {
      var q = loadQueue();
      q.push(payload);
      saveQueue(q);
    }
  });
}

function flushQueue() {
  if (!GAS_URL) return;
  var q = loadQueue();
  if (!q.length) return;
  saveQueue([]); // 楽観的にクリア。失敗分は再度積まれる
  q.forEach(function(payload) {
    postEvent(payload).then(function(ok) {
      if (!ok) { var cur = loadQueue(); cur.push(payload); saveQueue(cur); }
    });
  });
}

  lightsQuestion: { fontSize: 15, fontWeight: 700, color: "#f5f5f5", marginBottom: 14, marginTop: 8 },
  lightsChoiceRow: { display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" },
  lightsChoiceBtn: { flex: "1 1 45%", padding: "14px 0", backgroundColor: "#161616", border: "1px solid #2a2a2a", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: "pointer" },
  // done
  doneCard: { maxWidth: 400, width: "100%", textAlign: "center", marginTop: 40 },
  doneTitle: { fontSize: 22, fontWeight: 700, color: "#f5f5f5", margin: "0 0 10px 0" },
  doneBody: { fontSize: 15, color: "#777", marginBottom: 24 },
  countdown: { backgroundColor: "#111", border: "1px solid #1a1a1a", borderRadius: 12, padding: "20px", marginBottom: 16 },
  countdownLabel: { fontSize: 12, color: "#555", marginBottom: 6, letterSpacing: "0.1em", textTransform: "uppercase" },
  countdownValue: { fontSize: 32, fontWeight: 800, color: "#dc2626", fontVariantNumeric: "tabular-nums" },
  tipCard: { backgroundColor: "#0f1420", border: "1px solid #1e293b", borderRadius: 12, padding: "16px 18px", marginBottom: 16, textAlign: "left" },
  tipLabel: { fontSize: 11, color: "#60a5fa", fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 6 },
  tipText: { fontSize: 14, color: "#cbd5e1", lineHeight: 1.6 },
  resetBtn: { marginTop: 32, padding: "10px 20px", backgroundColor: "transparent", color: "#444", border: "1px solid #222", borderRadius: 8, fontSize: 12, cursor: "pointer" },
  // アクション（20:00 / 23:00）
  actionCard: { maxWidth: 400, width: "100%", backgroundColor: "#111", border: "2px solid #dc2626", borderRadius: 16, padding: "36px 24px", textAlign: "center", marginTop: 30 },
  actionIcon: { fontSize: 56, marginBottom: 16 },
  actionTitle: { fontSize: 22, fontWeight: 800, color: "#f5f5f5", margin: "0 0 12px 0", lineHeight: 1.3 },
  actionBody: { fontSize: 15, color: "#999", lineHeight: 1.7, marginBottom: 20, whiteSpace: "pre-line" },
  actionTime: { fontSize: 13, color: "#dc2626", fontWeight: 700, letterSpacing: "0.08em", marginBottom: 20 },
  actionConfirmBtn: { width: "100%", padding: "18px 24px", backgroundColor: "#dc2626", color: "#fff", border: "none", borderRadius: 12, fontSize: 17, fontWeight: 800, cursor: "pointer", letterSpacing: "0.02em" },
  actionChecklist: { textAlign: "left", marginBottom: 24, padding: "16px 20px", backgroundColor: "#0a0a0a", borderRadius: 10 },
  actionCheckItem: { display: "flex", alignItems: "center", gap: 10, padding: "8px 0", fontSize: 14, color: "#b0b0b0" },
  actionCheckDone: { color: "#22c55e", textDecoration: "line-through" },
  intentionRecall: { backgroundColor: "#0a0a0a", border: "1px dashed #333", borderRadius: 10, padding: "14px 16px", marginBottom: 20, textAlign: "left" },
  intentionRecallLabel: { fontSize: 11, color: "#666", marginBottom: 6 },
  intentionRecallText: { fontSize: 15, color: "#f59e0b", fontWeight: 600, lineHeight: 1.5, fontStyle: "italic" },
  goodnightCard: { maxWidth: 400, width: "100%", textAlign: "center", marginTop: 60 },
  goodnightIcon: { fontSize: 64, marginBottom: 16 },
  goodnightTitle: { fontSize: 24, fontWeight: 800, color: "#f5f5f5", margin: "0 0 12px 0" },
  goodnightBody: { fontSize: 16, color: "#777", lineHeight: 1.6, whiteSpace: "pre-line" },
  // 週末フリー選択
  choiceCard: { maxWidth: 400, width: "100%", textAlign: "center", marginTop: 50 },
  choiceIcon: { fontSize: 48, marginBottom: 16 },
  choiceTitle: { fontSize: 24, fontWeight: 800, color: "#f5f5f5", margin: "0 0 10px 0" },
  choiceBody: { fontSize: 15, color: "#999", marginBottom: 32, lineHeight: 1.6 },
  choiceExecBtn: { width: "100%", padding: "18px 24px", backgroundColor: "#dc2626", color: "#fff", border: "none", borderRadius: 12, fontSize: 17, fontWeight: 800, cursor: "pointer", marginBottom: 12, letterSpacing: "0.02em" },
  choiceFreeBtn: { width: "100%", padding: "16px 24px", backgroundColor: "transparent", color: "#888", border: "1px solid #333", borderRadius: 12, fontSize: 15, fontWeight: 600, cursor: "pointer" },
  restCard: { maxWidth: 400, width: "100%", textAlign: "center", marginTop: 70 },
  restIcon: { fontSize: 64, marginBottom: 16 },
  restTitle: { fontSize: 24, fontWeight: 800, color: "#60a5fa", margin: "0 0 12px 0" },
  restBody: { fontSize: 16, color: "#888", lineHeight: 1.7, whiteSpace: "pre-line" }
};

/* ============================================================
   メインコンポーネント
   ============================================================ */
function SleepCoach() {
  var phaseState = useState("loading");
  var phase = phaseState[0], setPhase = phaseState[1];

  var factIndexState = useState(0);
  var factIndex = factIndexState[0], setFactIndex = factIndexState[1];

  var factRevealedState = useState(false); // クイズ正解でファクト本文を開放
  var factRevealed = factRevealedState[0], setFactRevealed = factRevealedState[1];

  var wrongState = useState({}); // {choice: true} 不正解マーク
  var wrong = wrongState[0], setWrong = wrongState[1];

  var shakeState = useState(false);
  var shake = shakeState[0], setShake = shakeState[1];

  var rulesAckedState = useState(false);
  var rulesAcked = rulesAckedState[0], setRulesAcked = rulesAckedState[1];

  var intentionState = useState("");
  var intention = intentionState[0], setIntention = intentionState[1];

  var dataState = useState({ streak: 0, history: {}, lastCheckIn: null });
  var data = dataState[0], setData = dataState[1];

  var morningResultState = useState(null);
  var morningResult = morningResultState[0], setMorningResult = morningResultState[1];

  var todayFactsState = useState([]);
  var todayFacts = todayFactsState[0], setTodayFacts = todayFactsState[1];

  useEffect(function() {
    var loadedData;
    try {
      var value = localStorage.getItem(STORAGE_KEY);
      if (value) { loadedData = JSON.parse(value); }
    } catch (err) {}
    if (!loadedData) { loadedData = { streak: 0, history: {}, lastCheckIn: null }; }

    setData(loadedData);
    flushQueue(); // 溜まった未送信イベントを再送

    var today = getToday();
    setTodayFacts(shuffleFacts(today));
    setPhase(decidePhase(loadedData));
  }, []);

  // 状況からフェーズを決定
  function decidePhase(d) {
    var today = getToday();
    var rec = d.history[today] || {};
    var hour = getHour();

    // 朝の未報告（前日が実行日=committedかつrestDayでない、かつ結果未報告）
    if (d.lastCheckIn && d.lastCheckIn !== today) {
      var prev = d.history[d.lastCheckIn];
      if (prev && prev.committed && !prev.restDay && !prev.result) {
        return "morning";
      }
    }

    if (rec.restDay) return "rest";           // 今日はフリーを選択済み
    if (rec.committed) {
      if (hour >= 23 && !rec.phoneOut) return "phone";
      if (hour >= 20 && !rec.youtubeOff) return "youtube";
      if (hour >= 23 && rec.phoneOut) return "goodnight";
      return "done";
    }
    // 未チェックイン
    if (isWeekendChoice()) return "choice";    // 金土日は選択から
    return "facts";
  }

  function saveData(newData) {
    setData(newData);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch (err) {}
  }

  function updateTodayRecord(fields) {
    var today = getToday();
    var newHistory = assign({}, data.history);
    newHistory[today] = assign({}, newHistory[today], fields);
    saveData(assign({}, data, { history: newHistory }));
  }

  // --- クイズ回答 ---
  function handleAnswer(choice, correct) {
    if (choice === correct) {
      setFactRevealed(true);
    } else {
      var w = assign({}, wrong); w[choice] = true; setWrong(w);
      setShake(true);
      setTimeout(function() { setShake(false); }, 400);
    }
  }

  function handleNextFact() {
    if (factIndex < todayFacts.length - 1) {
      setFactIndex(factIndex + 1);
      setFactRevealed(false);
      setWrong({});
    } else {
      setPhase("rules");
    }
  }

  // --- 週末フリー選択 ---
  function handleChooseExec() {
    setPhase("facts");
  }
  function handleChooseFree() {
    var today = getToday();
    var newHistory = assign({}, data.history);
    newHistory[today] = { restDay: true, time: new Date().toISOString() };
    saveData(assign({}, data, { history: newHistory, lastCheckIn: today }));
    sendEvent("restDay", getDayOfWeek(today));
    setPhase("rest");
  }

  // --- 誓い ---
  function handleCommit() {
    if (intention.trim().length < 5) return;
    var today = getToday();
    var newHistory = assign({}, data.history);
    newHistory[today] = assign({}, newHistory[today], {
      committed: true, time: new Date().toISOString(), intention: intention.trim()
    });
    saveData(assign({}, data, { history: newHistory, lastCheckIn: today }));
    sendEvent("committed", intention.trim());
    var hour = getHour();
    if (hour >= 23) { setPhase("phone"); }
    else if (hour >= 20) { setPhase("youtube"); }
    else { setPhase("done"); }
  }

  function handleYoutubeOff() {
    updateTodayRecord({ youtubeOff: true, youtubeOffTime: new Date().toISOString() });
    sendEvent("youtubeOff");
    setPhase("done");
  }

  function handlePhoneOut() {
    updateTodayRecord({ phoneOut: true, phoneOutTime: new Date().toISOString() });
    sendEvent("phoneOut");
    setPhase("goodnight");
  }

  // --- 朝の報告 ---
  function handleMorningReport(success) {
    setMorningResult(success);
    var yesterday = data.lastCheckIn;
    if (!yesterday) return;
    var newHistory = assign({}, data.history);
    newHistory[yesterday] = assign({}, newHistory[yesterday], { result: success });
    var newStreak = success ? data.streak + 1 : 0;
    saveData(assign({}, data, { history: newHistory, streak: newStreak }));
    sendEvent("morning", success ? "success" : "fail");
    // 消灯時刻の質問へ（successの時のみ）。failなら次へ
    if (!success) {
      setTimeout(function() { advanceAfterMorning(); }, 1800);
    }
  }

  function handleLightsReport(optKey) {
    var yesterday = data.lastCheckIn;
    if (yesterday) {
      var newHistory = assign({}, data.history);
      newHistory[yesterday] = assign({}, newHistory[yesterday], { lightsOut: optKey });
      saveData(assign({}, data, { history: newHistory }));
      sendEvent("lightsOut", optKey);
    }
    advanceAfterMorning();
  }

  function advanceAfterMorning() {
    setMorningResult(null);
    // 報告後、今日のフェーズを再決定（データは最新のstateを使うためsetTimeoutで）
    var today = getToday();
    var rec = data.history[today] || {};
    if (rec.restDay) { setPhase("rest"); }
    else if (rec.committed) { setPhase("done"); }
    else if (isWeekendChoice()) { setPhase("choice"); }
    else { setPhase("facts"); }
  }

  function handleReset() {
    saveData({ streak: 0, history: {}, lastCheckIn: null });
    setFactIndex(0);
    setFactRevealed(false);
    setWrong({});
    setRulesAcked(false);
    setIntention("");
    setPhase(isWeekendChoice() ? "choice" : "facts");
  }

  // 週間データ
  var recentDays = [];
  for (var i = 6; i >= 0; i--) {
    var dd = new Date();
    dd.setDate(dd.getDate() - i);
    var key = dd.getFullYear() + "-" + String(dd.getMonth() + 1).padStart(2, "0") + "-" + String(dd.getDate()).padStart(2, "0");
    recentDays.push(assign({ date: key, day: getDayOfWeek(key) }, data.history[key]));
  }

  var rec = todayRecord(data);
  var today = getToday();

  // ============ 画面 ============

  if (phase === "loading") {
    return e("div", { style: S.container }, e("div", { style: S.loadingText }, "読み込み中..."));
  }

  // --- 週末フリー選択 ---
  if (phase === "choice") {
    return e("div", { style: S.container },
      e("div", { style: S.choiceCard },
        e("div", { style: S.choiceIcon }, "🌆"),
        e("h2", { style: S.choiceTitle }, getDayOfWeek(today) + "曜日の夜"),
        e("p", { style: S.choiceBody }, "今夜はどうする？\n無理のない範囲で、正直に選べ。"),
        e("button", { style: S.choiceExecBtn, onClick: handleChooseExec }, "今夜も23:00消灯を守る"),
        e("button", { style: S.choiceFreeBtn, onClick: handleChooseFree }, "今夜はフリー（夜更かしOK）")
      )
    );
  }

  // --- フリー日 ---
  if (phase === "rest") {
    return e("div", { style: S.container },
      e("div", { style: S.restCard },
        e("div", { style: S.restIcon }, "🍷"),
        e("h2", { style: S.restTitle }, "今夜はフリー"),
        e("p", { style: S.restBody }, "良い週末を。\nただし翌日に響かせるな。\n\n夜更かししても、起きる時刻だけは\nできるだけ守ると回復が早い。"),
        data.streak > 0 ? e("div", { style: assign({}, S.streakBanner, { marginTop: 24 }) }, "🔥 連続達成: " + data.streak + "日（維持中）") : null,
        e("button", { style: S.resetBtn, onClick: handleReset }, "リセット（テスト用）")
      )
    );
  }

  // --- 朝の報告 ---
  if (phase === "morning") {
    var morningContent;
    if (morningResult === null) {
      morningContent = e("div", null,
        e("p", { style: S.morningBody }, "23:00までにスマホを手放して消灯できましたか？"),
        e("div", { style: S.morningButtons },
          e("button", { style: S.successBtn, onClick: function() { handleMorningReport(true); } }, "✓ できた"),
          e("button", { style: S.failBtn, onClick: function() { handleMorningReport(false); } }, "✗ できなかった")
        )
      );
    } else if (morningResult === true) {
      // 消灯時刻を質問
      morningContent = e("div", null,
        e("p", { style: { color: "#22c55e", fontSize: 16, fontWeight: 700, marginBottom: 4 } }, "素晴らしい。"),
        e("div", { style: S.lightsQuestion }, "実際に消灯したのは何時ごろ？"),
        e("div", { style: S.lightsChoiceRow },
          LIGHTS_OPTIONS.map(function(opt) {
            return e("button", {
              key: opt.key,
              style: assign({}, S.lightsChoiceBtn, { color: opt.color, borderColor: opt.color + "55" }),
              onClick: function() { handleLightsReport(opt.key); }
            }, opt.label);
          })
        )
      );
    } else {
      morningContent = e("div", { style: S.morningResult },
        e("p", { style: { color: "#f59e0b", fontSize: 18, fontWeight: 700 } }, "正直に報告できたことが大事です。今夜こそ。")
      );
    }
    return e("div", { style: S.container },
      e("div", { style: S.morningCard },
        e("div", { style: { fontSize: 40, marginBottom: 12 } }, "🌅"),
        e("h2", { style: S.morningTitle }, "昨夜の結果報告"),
        morningContent
      )
    );
  }

  // --- ファクト（クイズ→本文） ---
  if (phase === "facts") {
    var fact = todayFacts[factIndex];
    if (!fact) return null;
    var progress = factIndex + 1;
    var total = todayFacts.length;
    var choices = shuffleChoices(fact.quiz.choices, today, "-q" + factIndex);

    var cardInner;
    if (!factRevealed) {
      // クイズ出題
      cardInner = e("div", { style: assign({}, S.factCard, shake ? { animation: "shake 0.4s" } : {}) },
        e("div", { style: S.categoryBadge }, fact.icon + " " + fact.category),
        e("div", { style: S.quizPrompt }, "問題"),
        e("div", { style: S.quizQuestion }, fact.quiz.q),
        choices.map(function(c) {
          var isWrong = wrong[c];
          return e("button", {
            key: c,
            disabled: isWrong,
            style: assign({}, S.quizChoice, isWrong ? S.quizChoiceWrong : {}),
            onClick: function() { handleAnswer(c, fact.quiz.answer); }
          }, (isWrong ? "✗ " : "") + c);
        }),
        e("div", { style: S.quizHint }, Object.keys(wrong).length > 0 ? "不正解。正しい答えを選べ。" : "")
      );
    } else {
      // 正解 → ファクト本文
      cardInner = e("div", { style: S.factCard },
        e("div", { style: S.categoryBadge }, "✓ 正解 — " + fact.category),
        e("div", { style: S.metricBlock },
          e("div", { style: S.metricValue }, fact.metric),
          e("div", { style: S.metricLabel }, fact.metricLabel)
        ),
        e("h2", { style: S.factTitle }, fact.title),
        e("p", { style: S.factBody }, fact.body),
        e("p", { style: S.factSource }, fact.source)
      );
    }

    return e("div", { style: S.container },
      e("div", { style: S.progressBar },
        e("div", { style: assign({}, S.progressFill, { width: (progress / total * 100) + "%" }) })
      ),
      e("div", { style: S.progressLabel }, progress + " / " + total),
      cardInner,
      factRevealed
        ? e("button", { style: S.nextBtn, onClick: handleNextFact },
            factIndex < todayFacts.length - 1 ? "次の問題へ →" : "ルール確認へ →")
        : null
    );
  }

  // --- ルール + 記述欄 ---
  if (phase === "rules") {
    var ruleItems = RULES.map(function(r, idx) {
      return e("div", { key: idx, style: S.ruleItem },
        e("span", { style: S.ruleIcon }, r.icon),
        e("span", { style: S.ruleText }, r.text)
      );
    });

    var weekDots = recentDays.map(function(dw, idx) {
      var bg, label;
      if (dw.restDay) { bg = "#2563eb"; label = "休"; }
      else if (dw.result === true) { bg = "#22c55e"; label = "✓"; }
      else if (dw.result === false) { bg = "#ef4444"; label = "✗"; }
      else if (dw.committed) { bg = "#f59e0b"; label = "−"; }
      else { bg = "#333"; label = ""; }
      return e("div", { key: idx, style: S.weekDay },
        e("div", { style: S.weekDayLabel }, dw.day),
        e("div", { style: assign({}, S.weekDot, { backgroundColor: bg }) }, label)
      );
    });

    var lightsBars = recentDays.map(function(dw, idx) {
      var opt = null;
      for (var j = 0; j < LIGHTS_OPTIONS.length; j++) { if (LIGHTS_OPTIONS[j].key === dw.lightsOut) opt = LIGHTS_OPTIONS[j]; }
      return e("div", { key: idx, style: S.lightsCell },
        e("div", { style: assign({}, S.lightsBar, { backgroundColor: opt ? opt.color : "#1a1a1a" }) })
      );
    });

    var canCommit = intention.trim().length >= 5;
    var bottomBtn;
    if (!rulesAcked) {
      bottomBtn = e("button", { style: S.ackBtn, onClick: function() { setRulesAcked(true); } }, "理解した。すべて読んだ。");
    } else {
      bottomBtn = e("div", null,
        e("div", { style: S.intentionBlock },
          e("div", { style: S.intentionLabel }, "今夜の最大の敵は？その対策は？"),
          e("div", { style: S.intentionHint }, "例）敵＝夕食後のYouTube／対策＝食べ終わったらすぐ風呂に入る"),
          e("textarea", {
            style: S.intentionArea,
            value: intention,
            placeholder: "ここに1文書く（5文字以上）",
            onChange: function(ev) { setIntention(ev.target.value); }
          }),
          e("div", { style: S.intentionCount }, intention.trim().length + " 文字")
        ),
        e("button", {
          style: assign({}, S.commitBtn, canCommit ? {} : S.commitBtnDisabled),
          disabled: !canCommit,
          onClick: handleCommit
        }, canCommit ? "今夜、23:00に消灯することを誓う" : "対策を書くと誓えます")
      );
    }

    return e("div", { style: S.container },
      e("h2", { style: S.rulesTitle }, "今夜守る4つのルール"),
      e("div", { style: S.rulesList }, ruleItems),
      data.streak > 0 ? e("div", { style: S.streakBanner }, "🔥 現在の連続達成: " + data.streak + "日") : null,
      e("div", { style: S.weekGrid }, weekDots),
      e("div", { style: S.sectionLabel }, "消灯時刻の記録"),
      e("div", { style: S.lightsRow }, lightsBars),
      bottomBtn
    );
  }

  // 共通: intention再表示ブロック
  function intentionRecall() {
    if (!rec.intention) return null;
    return e("div", { style: S.intentionRecall },
      e("div", { style: S.intentionRecallLabel }, "今朝のあなたの誓い:"),
      e("div", { style: S.intentionRecallText }, "「" + rec.intention + "」")
    );
  }

  // --- YouTube (20:00~) ---
  if (phase === "youtube") {
    return e("div", { style: S.container },
      e("div", { style: S.actionCard },
        e("div", { style: S.actionIcon }, "📵"),
        e("div", { style: S.actionTime }, "20:00 — アクション必須"),
        e("h2", { style: S.actionTitle }, "YouTubeを今すぐ閉じろ"),
        intentionRecall(),
        e("p", { style: S.actionBody }, "食後のダラダラ視聴が睡眠時間を奪う最大の原因。\n「あと1本」はない。今閉じなければ23:00消灯は不可能。"),
        e("div", { style: S.actionChecklist },
          e("div", { style: S.actionCheckItem }, "1. YouTubeアプリを閉じる"),
          e("div", { style: S.actionCheckItem }, "2. X（Twitter）も閉じる"),
          e("div", { style: S.actionCheckItem }, "3. Amazon・メルカリも閲覧しない")
        ),
        e("button", { style: S.actionConfirmBtn, onClick: handleYoutubeOff }, "すべて閉じた。確認する。")
      )
    );
  }

  // --- Phone (23:00~) ---
  if (phase === "phone") {
    return e("div", { style: S.container },
      e("div", { style: assign({}, S.actionCard, { borderColor: "#f59e0b" }) },
        e("div", { style: S.actionIcon }, "🚪"),
        e("div", { style: assign({}, S.actionTime, { color: "#f59e0b" }) }, "23:00 — 最終アクション"),
        e("h2", { style: S.actionTitle }, "スマホをリビングに置け"),
        intentionRecall(),
        e("p", { style: S.actionBody }, "寝室にスマホを持ち込んだ時点で負け。\n目覚ましはスマートウォッチで十分。今すぐ手放せ。"),
        e("div", { style: S.actionChecklist },
          e("div", { style: S.actionCheckItem }, "1. おやすみモードをONにする"),
          e("div", { style: S.actionCheckItem }, "2. スマホをリビングの充電器に置く"),
          e("div", { style: S.actionCheckItem }, "3. 寝室に入る → 消灯")
        ),
        e("button", { style: assign({}, S.actionConfirmBtn, { backgroundColor: "#f59e0b", color: "#000" }), onClick: handlePhoneOut }, "スマホを置いた。おやすみ。")
      )
    );
  }

  // --- Goodnight ---
  if (phase === "goodnight") {
    return e("div", { style: S.container },
      e("div", { style: S.goodnightCard },
        e("div", { style: S.goodnightIcon }, "🌙"),
        e("h2", { style: S.goodnightTitle }, "おやすみなさい"),
        e("p", { style: S.goodnightBody }, "今日のすべてのタスク完了。\nあとは目を閉じるだけ。"),
        e("div", { style: assign({}, S.actionChecklist, { marginTop: 24 }) },
          e("div", { style: assign({}, S.actionCheckItem, S.actionCheckDone) }, "✓ チェックイン完了"),
          e("div", { style: assign({}, S.actionCheckItem, S.actionCheckDone) }, "✓ YouTube・SNS終了"),
          e("div", { style: assign({}, S.actionCheckItem, S.actionCheckDone) }, "✓ スマホをリビングに配置")
        ),
        data.streak > 0 ? e("div", { style: assign({}, S.streakBanner, { marginTop: 20 }) }, "🔥 連続達成: " + data.streak + "日") : null,
        e("button", { style: S.resetBtn, onClick: handleReset }, "リセット（テスト用）")
      )
    );
  }

  // --- Done ---
  if (phase === "done") {
    var now = new Date();
    var hour = getHour();

    var nextAction = null, nextTime = null;
    if (!rec.youtubeOff && hour < 20) {
      nextAction = "📵 YouTubeを閉じる";
      nextTime = new Date(); nextTime.setHours(20, 0, 0, 0);
    } else if (!rec.phoneOut) {
      nextAction = "🚪 スマホをリビングに置く";
      nextTime = new Date(); nextTime.setHours(23, 0, 0, 0);
    }

    var target23 = new Date(); target23.setHours(23, 0, 0, 0);
    var diffLights = target23 - now;
    var hoursLeft = diffLights > 0 ? Math.floor(diffLights / 3600000) : 0;
    var minsLeft = diffLights > 0 ? Math.floor((diffLights % 3600000) / 60000) : 0;

    var diffNext = nextTime ? nextTime - now : 0;
    var nextH = diffNext > 0 ? Math.floor(diffNext / 3600000) : 0;
    var nextM = diffNext > 0 ? Math.floor((diffNext % 3600000) / 60000) : 0;

    var tip = TIPS[hashStr(today) % TIPS.length];

    return e("div", { style: S.container },
      e("div", { style: S.doneCard },
        e("div", { style: { fontSize: 48, marginBottom: 8 } }, "✅"),
        e("h2", { style: S.doneTitle }, "今日のチェックイン完了"),
        e("p", { style: S.doneBody }, "今夜の誓いは記録されました。"),
        diffLights > 0 ? e("div", { style: S.countdown },
          e("div", { style: S.countdownLabel }, "消灯まで"),
          e("div", { style: S.countdownValue }, hoursLeft + "時間 " + minsLeft + "分")
        ) : null,
        nextAction && diffNext > 0 ? e("div", { style: assign({}, S.countdown, { borderColor: "#f59e0b" }) },
          e("div", { style: S.countdownLabel }, "次のアクション"),
          e("div", { style: { fontSize: 16, fontWeight: 700, color: "#f5f5f5", marginBottom: 4 } }, nextAction),
          e("div", { style: { fontSize: 14, color: "#f59e0b" } }, nextH + "時間 " + nextM + "分後")
        ) : null,
        e("div", { style: S.tipCard },
          e("div", { style: S.tipLabel }, "💡 今夜の睡眠Tip"),
          e("div", { style: S.tipText }, tip)
        ),
        e("div", { style: S.actionChecklist },
          e("div", { style: assign({}, S.actionCheckItem, rec.committed ? S.actionCheckDone : {}) }, (rec.committed ? "✓ " : "○ ") + "チェックイン"),
          e("div", { style: assign({}, S.actionCheckItem, rec.youtubeOff ? S.actionCheckDone : {}) }, (rec.youtubeOff ? "✓ " : "○ ") + "YouTube・SNS終了（20:00）"),
          e("div", { style: assign({}, S.actionCheckItem, rec.phoneOut ? S.actionCheckDone : {}) }, (rec.phoneOut ? "✓ " : "○ ") + "スマホ追放（23:00）")
        ),
        data.streak > 0 ? e("div", { style: assign({}, S.streakBanner, { marginTop: 20 }) }, "🔥 連続達成: " + data.streak + "日") : null,
        e("button", { style: S.resetBtn, onClick: handleReset }, "リセット（テスト用）")
      )
    );
  }

  return null;
}

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(SleepCoach));
  </script>
</body>
</html>
